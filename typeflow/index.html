<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeFlow - Typing Speed Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">Type<span>Flow</span></a>
    <div class="best-badge">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/>
        <path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>
      </svg>
      <span>Best: <strong id="bestTop">0 WPM</strong></span>
    </div>
  </header>

  <main class="page">
    <section id="testView" class="view">
      <div class="intro">
        <h1>Test Your Typing Speed</h1>
        <p>Improve your speed, accuracy, and consistency.</p>
      </div>

      <div class="levels" id="levels">
        <button class="level active" data-level="easy" type="button">Easy</button>
        <button class="level" data-level="medium" type="button">Medium</button>
        <button class="level" data-level="hard" type="button">Hard</button>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">WPM</span>
          <span class="stat-value" id="wpm">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Accuracy</span>
          <span class="stat-value" id="accuracy">100%</span>
        </div>
        <div class="stat">
          <span class="stat-label">Time</span>
          <span class="stat-value" id="time">60s</span>
        </div>
      </div>

      <div class="typing-box" id="typingBox"></div>

      <div class="actions">
        <button class="btn" id="restart" type="button">Restart Test</button>
      </div>
    </section>

    <section id="resultView" class="view hidden">
      <div class="result-card">
        <div class="check">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12.5l4.5 4.5L19 7.5"/>
          </svg>
        </div>
        <h2>Test Complete!</h2>

        <div class="result-grid">
          <div class="result-item">
            <span class="stat-label">WPM</span>
            <span class="result-value" id="finalWpm">0</span>
          </div>
          <div class="result-item bordered">
            <span class="stat-label">Accuracy</span>
            <span class="result-value" id="finalAccuracy">0%</span>
          </div>
          <div class="result-item">
            <span class="stat-label">Best</span>
            <span class="result-value accent" id="finalBest">0 WPM</span>
            <span class="new-score hidden" id="newScore">New High Score!</span>
          </div>
        </div>

        <div class="actions">
          <button class="btn" id="tryAgain" type="button">Try Again</button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
